name: Build News Intelligence Agent B MCP image

on:
  push:
    branches:
      - main
    paths:
      - server.py
      - launcher.py
      - requirements.txt
      - Dockerfile
      - .dockerignore
      - .github/workflows/build-mcp-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: news-agent-b-pg-mcp-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Static Python syntax check
        run: python -m py_compile server.py launcher.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: news-agent-b-pg-mcp:ci
          labels: |
            org.opencontainers.image.source=https://github.com/haowang2025/azure-db-mcp
            org.opencontainers.image.description=News Intelligence Agent B controlled read-write PostgreSQL MCP server

      - name: Smoke test server startup
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name pg-mcp-smoke -p 8000:8000 \
            -e DBHOST=127.0.0.1 \
            -e DBNAME=smoke \
            -e DBUSER=smoke \
            -e DBPASSWORD=smoke \
            -e NEWS_SCHEMA=news_agent \
            -e ALLOWED_SCHEMAS=news_agent \
            -e MCP_ACCESS_TOKEN=ci-test-token \
            news-agent-b-pg-mcp:ci

          cleanup() {
            docker logs pg-mcp-smoke || true
            docker rm -f pg-mcp-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ok=0
          for i in $(seq 1 30); do
            if python -c "import socket; s=socket.create_connection(('127.0.0.1',8000),1); s.close()"; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/haowang2025/azure-db-mcp
          docker tag news-agent-b-pg-mcp:ci "$IMAGE:latest"
          docker tag news-agent-b-pg-mcp:ci "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
