name: Build Azure PostgreSQL MCP image

on:
  push:
    branches:
      - main
    paths:
      - server.py
      - requirements.txt
      - Dockerfile
      - .dockerignore
      - .github/workflows/build-mcp-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: azure-pg-mcp-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/haowang2025/azure-pg-mcp:latest
            ghcr.io/haowang2025/azure-pg-mcp:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/haowang2025/4
            org.opencontainers.image.description=Read-only Azure PostgreSQL MCP server

      - name: Smoke test server startup
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/haowang2025/azure-pg-mcp:${GITHUB_SHA}"
          docker run -d --name pg-mcp-smoke -p 8000:8000 \
            -e DBHOST=127.0.0.1 \
            -e DBNAME=smoke \
            -e DBUSER=smoke \
            -e DBPASSWORD=smoke \
            "$IMAGE"

          ok=0
          for i in $(seq 1 30); do
            if python - <<'PY'
import socket
s = socket.create_connection(("127.0.0.1", 8000), timeout=1)
s.close()
PY
            then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            docker logs pg-mcp-smoke
            exit 1
          fi

          docker logs pg-mcp-smoke
          docker rm -f pg-mcp-smoke
